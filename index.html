<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>SpendWise</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Set Your Budget</h2>
            <form id="budgetForm">
                <label for="budgetInput">Your budget (KSh)</label>
                <input
                    type="number"
                    id="budgetInput"
                    min="0"
                    step="0.01"
                    placeholder="Enter your budget"
                    required
                >
                <button type="submit">Set Budget</button>
            </form>
        </section>

        <section class="dashboard">
            <div class="summary-card">
                <h3>Total Budget</h3>
                <p id="budgetOutput">KSh 0.00</p>
            </div>

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="expensesOutput">KSh 0.00</p>
            </div>

            <div class="summary-card">
                <h3>Remaining Balance</h3>
                <p id="balanceOutput">KSh 0.00</p>
            </div>
        </section>

        <section class="card">
            <h2>Add an Expense</h2>

            <form id="expenseForm">
                <label for="expenseName">Expense name</label>
                <input
                    type="text"
                    id="expenseName"
                    placeholder="e.g. Food"
                    required
                >

                <label for="expenseAmount">Amount (KSh)</label>
                <input
                    type="number"
                    id="expenseAmount"
                    min="0.01"
                    step="0.01"
                    placeholder="Enter amount"
                    required
                >

                <label for="expenseCategory">Category</label>
                <select id="expenseCategory" required>
                    <option value="">Choose a category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
            <p id="message" aria-live="polite"></p>
        </section>

        <section class="card">
            <h2>Your Expenses</h2>
            <div id="expenseList">
                <p>No expenses added yet.</p>
            </div>
        </section>

        <section class="card">
            <h2>Budget Status</h2>
            <p id="budgetStatus">Please set your budget to begin.</p>
            <button type="button" id="clearButton" class="clear-button">
                Clear All Expenses
            </button>
        </section>
    </main>

    <footer>
        <p>SpendWise Budget Tracker</p>
    </footer>
</body>
</html>
